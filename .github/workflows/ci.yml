name: CI
on:
  push:
    branches-ignore: [ci-artifacts]
  pull_request:
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Apply migrations and run database tests
        env:
          PGPASSWORD: postgres
        run: |
          P="psql -h localhost -U postgres -v ON_ERROR_STOP=1 -q"
          $P -c "create database cbtest"
          for f in db/test/00_supabase_stub.sql db/test/01_existing_schema.sql \
                   db/migrations/001_secure_foundation_and_school_events.sql \
                   db/migrations/001_secure_foundation_and_school_events.sql \
                   db/migrations/002_lock_down_public_access.sql; do
            $P -d cbtest -f "$f" 2>&1 | grep -v NOTICE || true
          done
          $P -d cbtest -f db/test/10_database_tests.sql 2>&1 | tee db-test.log
          grep -c passed db-test.log
      - name: Report
        if: always()
        run: |
          if [ -f db-test.log ]; then
            echo "::notice title=Database tests::$(grep -E 'passed|ERROR' db-test.log | sed 's/^psql:[^ ]* //' | tr '\n' '|' )"
          fi
